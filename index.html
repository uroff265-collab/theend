<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheEnd — Dashboard</title>
<style>
:root {
  --bg:#0b0b12; --panel:#15151f; --border:#29283a;
  --text:#f1eff8; --muted:#9291a8; --purple:#9668f5;
  --green:#66ddb0; --yellow:#e5bf79; --red:#f07882;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font:15px Arial, sans-serif;
  background-image:radial-gradient(ellipse at 75% -10%,#27183d,transparent 45%);
  min-height:100vh;
}
button { font:inherit; cursor:pointer; }
.layout { display:flex; min-height:100vh; }
.sidebar {
  width:240px; background:#0d0d15; border-right:1px solid var(--border);
  padding:22px 15px; display:flex; flex-direction:column; flex-shrink:0;
}
.logo { display:flex; align-items:center; gap:11px; margin:0 8px 30px; }
.logo-icon {
  width:42px;height:42px;border-radius:13px;
  background:linear-gradient(140deg,#b17bff,#6941be);
  display:grid;place-items:center;font-size:21px;font-weight:bold;
}
.logo-name { font-size:18px;font-weight:800;letter-spacing:2px; }
.logo-name small { display:block;font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:1px; }
.nav-title { font-size:10px;letter-spacing:2px;color:#65657a;margin:12px 10px; }
.nav-btn {
  display:flex;gap:12px;align-items:center;width:100%;
  padding:12px;border-radius:10px;border:1px solid transparent;
  background:transparent;color:#aaa9bc;text-align:left;margin:3px 0;
}
.nav-btn:hover { background:#1a1925;color:#eee; }
.nav-btn.active {
  color:#d0b5ff;background:#8354d51f;border-color:#8056d32c;
}
.nav-icon { width:22px;text-align:center;font-size:17px; }
.sidebar-bottom { margin-top:auto; }
.user-box { border-top:1px solid var(--border);margin-top:20px;padding:15px 8px;display:flex;gap:10px;align-items:center; }
.avatar { width:35px;height:35px;border-radius:50%;background:linear-gradient(140deg,#7251b7,#b879f4);display:grid;place-items:center;font-weight:bold; }
.user-box small { display:block;color:var(--muted);margin-top:4px;font-size:11px; }
main { width:100%;max-width:1500px;margin:auto;padding:30px 38px; }
.topbar { display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:10px; }
.crumb { color:var(--muted);font-size:13px; }
.system-status { color:var(--green);border:1px solid #274337;background:#14241d;padding:8px 12px;border-radius:30px;font-size:12px; }
h1 { margin:0 0 8px;font-size:29px; }
.subtitle { color:var(--muted);margin:0 0 25px;line-height:1.6; }
.hero {
  border:1px solid #392b56;border-radius:17px;padding:27px 29px;
  background:linear-gradient(110deg,#241838,#171520 70%);
  margin-bottom:22px;position:relative;overflow:hidden;
}
.hero-tag { color:#c6a9ff;border:1px solid #7954b755;background:#241b35;padding:7px 11px;border-radius:30px;font-size:11px;display:inline-block;margin-bottom:16px; }
.hero h2 { margin:0 0 10px;font-size:22px; }
.hero p { color:#aaa4ba;line-height:1.6;max-width:600px;margin:0 0 20px; }
.primary {
  background:linear-gradient(135deg,#a278ff,#7047cb);border:0;color:white;
  padding:11px 16px;border-radius:10px;font-weight:bold;
}
.primary:hover { filter:brightness(1.12); }
.stats { display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px; }
.stat,.card { border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:18px; }
.stat-label { color:var(--muted);font-size:12px; }
.stat-value { font-size:27px;font-weight:bold;margin:13px 0 6px; }
.stat-foot { font-size:11px;color:#77778e; }
.grid { display:grid;grid-template-columns:1.4fr 1fr;gap:16px; }
.card-title { display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:10px; }
.card-title h3 { font-size:15px;margin:0; }
.activity { display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #252532; }
.activity-icon,.server-icon { width:38px;height:38px;border-radius:11px;background:#252134;display:grid;place-items:center;flex-shrink:0; }
.activity strong,.server strong { font-size:13px; }
.activity small,.server small { display:block;color:var(--muted);font-size:11px;margin-top:4px; }
.badge { margin-left:auto;font-size:11px;color:var(--green);background:#142721;padding:6px 9px;border-radius:30px;white-space:nowrap; }
.badge.demo { color:var(--yellow);background:#2a2417; }
.server { display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid #252532; }
.server-left { display:flex;gap:11px;align-items:center; }
.link { color:#b79aff;font-size:12px; }
.footer { color:#5f5f74;text-align:center;font-size:11px;margin:27px 0 5px; }
.account-row { gap:12px; }
.account-info { min-width:0;flex:1; }
.account-info small { overflow-wrap:anywhere; }
.actions { display:flex;gap:7px; }
.icon-btn {
  border:1px solid var(--border);background:#1b1b26;color:#aaa;
  padding:8px 10px;border-radius:9px;
}
.icon-btn:hover { background:#29283a;color:white; }
.empty { text-align:center;padding:36px 10px;color:var(--muted); }
.empty-icon { font-size:36px;margin-bottom:12px; }
.empty strong { color:var(--text); }
.modal-backdrop {
  display:none;position:fixed;inset:0;background:#000a;
  align-items:center;justify-content:center;padding:15px;z-index:20;
}
.modal-backdrop.open { display:flex; }
.modal { width:100%;max-width:440px;background:#171721;border:1px solid #343247;border-radius:17px;padding:23px;box-shadow:0 20px 80px #0008; }
.modal h2 { margin:0 0 20px;font-size:20px; }
.field { margin-bottom:14px; }
.field label { display:block;font-size:12px;color:#aaa9bc;margin-bottom:7px; }
.field input,.field select {
  width:100%;padding:12px;border:1px solid #353447;border-radius:10px;
  background:#101018;color:white;outline:none;
}
.field input:focus,.field select:focus { border-color:var(--purple); }
.modal-buttons { display:flex;gap:10px;margin-top:20px; }
.modal-buttons button { flex:1; }
.secondary { padding:11px;border-radius:10px;background:#23222e;border:1px solid #363548;color:#ddd; }

.task-list { display:flex; flex-direction:column; }
.task-row { display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #252532; }
.task-main { flex:1;min-width:0; }
.task-main strong { display:block;font-size:13px; }
.task-main small { display:block;color:var(--muted);font-size:11px;margin-top:5px; }
.task-meta { color:var(--muted);font-size:11px;margin-top:5px; }
.task-actions { display:flex;gap:7px;align-items:center; }
.switch { display:flex;align-items:center;gap:9px;color:#aaa9bc;font-size:11px;white-space:nowrap;cursor:pointer; }
.switch input { appearance:none;-webkit-appearance:none;position:relative;width:42px;height:24px;flex:0 0 42px;border-radius:20px;background:#343342;border:1px solid #49475d;outline:none;cursor:pointer;transition:background .2s,border-color .2s; }
.switch input::before { content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;border-radius:50%;background:#aaa8ba;box-shadow:0 2px 5px #0006;transition:transform .2s,background .2s; }
.switch input:checked { background:linear-gradient(135deg,#a278ff,#7047cb);border-color:#a278ff; }
.switch input:checked::before { transform:translateX(18px);background:#fff; }
.switch input:disabled { opacity:.55;cursor:wait; }
.module-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px; }
.module-tile { display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0;padding:14px 15px;border:1px solid #302d40;border-radius:12px;background:linear-gradient(135deg,#1b1a27,#15151f); }
.module-tile:hover { border-color:#554176;background:#211c2e; }
.module-info { min-width:0; }
.module-heading { display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
.module-heading strong { font-size:13px; }
.module-info small { display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:6px; }
.module-tag { display:inline-flex;align-items:center;border-radius:20px;padding:4px 7px;font-size:9px;letter-spacing:.4px;color:#d5c3ff;background:#33264c;border:1px solid #5b4380;white-space:nowrap; }
.module-tag.planned { color:#c4c1d0;background:#252431;border-color:#3c394b; }
.module-control { flex-shrink:0; }
.module-grid { grid-template-columns:repeat(3,minmax(0,1fr));gap:12px; }
.module-tile { min-height:154px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:16px 17px 13px;background:#1c2525;border:1px solid #303b3b;border-radius:4px; }
.module-tile:hover { background:#202b2b;border-color:#52605e; }
.module-top { display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:23px; }
.module-top strong { font-size:14px;line-height:1.3; }
.module-status { align-self:flex-start;margin-top:12px;padding:4px 8px;border-radius:3px;background:#393323;color:#e8aa4c;font-size:10px;font-weight:bold;letter-spacing:.7px; }
.module-status.off { background:#292f2f;color:#9aa3a0; }
.module-description { color:#d6dcda;font-size:12px;line-height:1.4;margin-top:13px;min-height:17px; }
.module-footer { display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:12px; }
.module-actions { display:flex;gap:6px;align-items:center; }
.module-action { padding:6px 10px;border:1px solid #52605e;border-radius:3px;background:transparent;color:#dbe1df;font-size:12px;font-weight:bold; }
.module-action.primary-action { background:#efb85f;border-color:#efb85f;color:#171717; }
.module-grip { color:#87928f;font-size:18px;letter-spacing:1px; }
.module-toggle { width:38px!important;height:21px!important;flex:0 0 38px!important;background:#394242!important;border:0!important; }
.module-toggle::before { width:15px!important;height:15px!important;left:3px!important;top:3px!important;background:#171e1e!important; }
.module-toggle:checked { background:#efb85f!important; }
.module-toggle:checked::before { transform:translateX(17px)!important;background:#fff!important; }
.module-modal-shade { position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px; }
.module-modal { width:min(560px,100%);background:#172020;border:1px solid #53605e;border-radius:4px;box-shadow:0 20px 70px #000b;color:#edf0ed; }
.module-modal-head { display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid #354140;gap:12px; }
.module-modal-head strong { font-size:17px; }
.module-tabs { display:flex;border-bottom:1px solid #354140;padding:0 16px; }
.module-tab { flex:1;padding:13px 8px;border:0;border-bottom:2px solid transparent;background:none;color:#9da8a5;font-weight:bold; }
.module-tab.active { color:#f1bd69;border-color:#f1bd69; }
.module-modal-body { padding:16px;min-height:210px;font-size:13px;line-height:1.6; }
.module-modal-foot { padding:10px 16px 16px; }
.module-modal-ok { width:100%;padding:11px;border:0;border-radius:3px;background:#efb85f;color:#171717;font-weight:bold; }
@media(max-width:900px) { .module-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(max-width:700px) { .module-grid { grid-template-columns:1fr; } .module-tile { padding:14px; } }
.task-dot { width:9px;height:9px;border-radius:50%;background:var(--green);flex-shrink:0; }
.task-dot.off { background:#77778e; }
.wide-field { grid-column:1/-1; }
.setting-row { display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px 0;border-top:1px solid #252532; }
.setting-row small { display:block;color:var(--muted);margin-top:5px;line-height:1.5; }
@media(max-width:700px) {
  .task-row { align-items:flex-start;flex-wrap:wrap; }
  .task-actions { width:100%;justify-content:flex-end; }
}

@media(max-width:1000px) {
  main { padding:24px; }
  .stats { grid-template-columns:repeat(2,1fr); }
}
@media(max-width:700px) {
  .sidebar { width:65px;padding:15px 8px; }
  .logo { justify-content:center;margin:0 0 25px; }
  .logo-name,.nav-title,.nav-btn span:not(.nav-icon),.user-box div:not(.avatar) { display:none; }
  .nav-btn { justify-content:center;padding:12px 5px; }
  .user-box { justify-content:center;padding:12px 0; }
  main { padding:17px 13px; }
  .grid { grid-template-columns:1fr; }
  .stats { gap:9px; }
  .stat { padding:13px; }
  .stat-value { font-size:22px; }
  h1 { font-size:24px; }
  .hero { padding:21px; }
}
</style>
</head>
<body>

<div class="layout">
<aside class="sidebar">
  <div class="logo">
    <div class="logo-icon">E</div>
    <div class="logo-name">THEEND<small>GAME DASHBOARD</small></div>
  </div>

  <div class="nav-title">МЕНЮ</div>
  <button class="nav-btn active" data-page="home"><span class="nav-icon">⌂</span><span>Обзор</span></button>
  <button class="nav-btn" data-page="accounts"><span class="nav-icon">▣</span><span>Мои аккаунты</span></button>
  <button class="nav-btn" data-page="automation"><span class="nav-icon">⚙</span><span>Автоматизация</span></button>
  <button class="nav-btn" data-page="schedule"><span class="nav-icon">◷</span><span>Расписание</span></button>
  <button class="nav-btn" data-page="history"><span class="nav-icon">▤</span><span>История задач</span></button>

  <div class="nav-title">СИСТЕМА</div>
  <button class="nav-btn" data-page="settings"><span class="nav-icon">⚑</span><span>Настройки</span></button>

  <div class="sidebar-bottom">
    <div class="user-box">
      <div class="avatar">U</div>
      <div><strong>Player</strong><small>Базовый доступ</small></div>
    </div>
  </div>
</aside>

<main id="main"></main>
</div>

<!-- Диалог аккаунта -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">Добавить аккаунт</h2>
    <form id="accountForm">
      <div class="field">
        <label for="accName">Игровой ник</label>
        <input id="accName" maxlength="50" required placeholder="Введите ник">
      </div>
      <div class="field">
        <label for="accUid">UID</label>
        <input id="accUid" maxlength="80" required placeholder="ID игрового профиля">
      </div>
      <div class="field">
        <label for="accServer">Сервер</label>
        <input id="accServer" maxlength="50" required placeholder="Например, EU-1">
      </div>
      <div class="field">
        <label for="accStatus">Статус профиля</label>
        <select id="accStatus">
          <option>Демо</option>
          <option>Активен</option>
          <option>Неактивен</option>
        </select>
      </div>
      <div class="modal-buttons">
        <button type="button" class="secondary" id="cancelModal">Отмена</button>
        <button type="submit" class="primary">Сохранить</button>
      </div>
    </form>
  </div>
</div>


<!-- Диалог задачи -->
<div class="modal-backdrop" id="taskModalBackdrop">
  <div class="modal">
    <h2 id="taskModalTitle">Новая задача</h2>
    <form id="taskForm">
      <div class="field">
        <label for="taskName">Название задачи</label>
        <input id="taskName" maxlength="70" required placeholder="Например, ежедневная проверка">
      </div>
      <div class="field">
        <label for="taskType">Тип задачи</label>
        <select id="taskType">
          <option>Проверка профиля</option>
          <option>Ежедневное напоминание</option>
          <option>Пользовательская задача</option>
        </select>
      </div>
      <div class="field">
        <label for="taskAccount">Игровой профиль</label>
        <select id="taskAccount"></select>
      </div>
      <div class="field">
        <label for="taskDate">Дата и время (для ежедневной задачи используется время)</label>
        <input id="taskDate" type="datetime-local" required>
      </div>
      <div class="field">
        <label for="taskRecurrence">Повторение</label>
        <select id="taskRecurrence"><option value="once">Один раз</option><option value="daily">Каждый день</option></select>
      </div>
      <div class="field">
        <label><input id="taskEnabled" type="checkbox" checked style="width:auto;margin-right:7px;accent-color:var(--purple)"> Задача включена</label>
      </div>
      <div class="modal-buttons">
        <button type="button" class="secondary" id="cancelTaskModal">Отмена</button>
        <button type="submit" class="primary">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<script>
(async () => {
  const main = document.getElementById("main");
  const nav = document.querySelectorAll(".nav-btn");
  const modal = document.getElementById("modalBackdrop");
  const form = document.getElementById("accountForm");
  const KEY = "theend_accounts_v2";
  const TASK_KEY = "theend_tasks_v1";
  const SETTINGS_KEY = "theend_settings_v1";
  const LIMIT = 5;
  const TASK_LIMIT = 20;
  const taskModal = document.getElementById("taskModalBackdrop");
  const taskForm = document.getElementById("taskForm");
  let editingTaskId = null;
  let editingIndex = null;
  let currentPage = "home";

  let accountsCache = [];
  async function refreshAccounts() {
    const response = await fetch("/api/accounts");
    if (!response.ok) throw new Error("Не удалось загрузить аккаунты с сервера.");
    accountsCache = await response.json();
    return accountsCache;
  }
  const readAccounts = () => accountsCache;
  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));


  let tasksCache = [];
  async function refreshTasks() {
    const response = await fetch("/api/tasks");
    if (!response.ok) throw new Error("Не удалось загрузить задачи с сервера.");
    tasksCache = await response.json();
    return tasksCache;
  }
  const readTasks = () => tasksCache;
  const saveTasks = value => { tasksCache = value; };
  let historyCache = [];
  async function refreshHistory() {
    const response = await fetch("/api/history");
    if (!response.ok) throw new Error("Не удалось загрузить историю с сервера.");
    historyCache = await response.json();
    return historyCache;
  }
  const readHistory = () => historyCache;
  async function logAction(title, detail = "") {
    try {
      const response = await fetch("/api/history", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({title, detail})
      });
      if (!response.ok) throw new Error("Не удалось сохранить запись истории.");
      await refreshHistory();
      if (currentPage === "history") renderHistory();
    } catch (error) {
      console.error("History logging failed:", error);
    }
  }
  const readSettings = () => {
    try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{"confirmDelete":true}'); }
    catch { return { confirmDelete:true }; }
  };
  const saveSettings = value => localStorage.setItem(SETTINGS_KEY, JSON.stringify(value));
  const formatDate = value => {
    if (!value) return "Не задано";
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? "Некорректная дата" : date.toLocaleString("ru-RU", { dateStyle:"short", timeStyle:"short" });
  };
  function openTaskModal(id = null) {
    const tasks = readTasks();
    if (id === null && tasks.length >= TASK_LIMIT) { alert("Достигнут лимит демо-версии — 20 задач."); return; }
    editingTaskId = id;
    const task = id === null ? { title:"", type:"Проверка профиля", accountId:"", scheduledAt:"", recurrence:"once", enabled:true } : tasks.find(item => String(item.id) === String(id));
    if (!task) return;
    const accountSelect = document.getElementById("taskAccount");
    const accounts = readAccounts();
    accountSelect.innerHTML = '<option value="">Без привязки к профилю</option>' + accounts.map(a => '<option value="' + esc(a.id) + '">' + esc(a.name) + ' · ' + esc(a.server) + '</option>').join("");
    document.getElementById("taskModalTitle").textContent = id === null ? "Новая задача" : "Редактировать задачу";
    document.getElementById("taskName").value = task.title || "";
    document.getElementById("taskType").value = task.type || "Проверка профиля";
    accountSelect.value = task.accountId === null || task.accountId === undefined ? "" : String(task.accountId);
    document.getElementById("taskDate").value = task.scheduledAt || "";
    document.getElementById("taskRecurrence").value = task.recurrence || "once";
    document.getElementById("taskEnabled").checked = task.enabled !== false;
    taskModal.classList.add("open");
    document.getElementById("taskName").focus();
  }
  function closeTaskModal() {
    taskModal.classList.remove("open");
    taskForm.reset();
    editingTaskId = null;
  }
  function renderAutomation() {
    const tasks = readTasks();
    const accounts = readAccounts();
    main.innerHTML = `
      ${topbar("Автоматизация")}
      <h1>Автоматизация</h1>
      <p class="subtitle">Создавай задачи, связывай их с игровыми профилями и включай или отключай их.</p>
      <section class="hero">
        <span class="hero-tag">TASK MANAGER · DATABASE</span>
        <h2>Управление задачами</h2>
        <p>Задачи и расписание сохраняются на сервере в Neon. Агент анализирует экран локально. Доступно распознавание игровых элементов; действия без уверенного совпадения не выполняются.</p>

    async function updateAgentStatus() {
      const badge = document.getElementById("agentBadge");
      const label = document.getElementById("agentStatusText");
      if (!badge || !label) return;
      try {
        const response = await fetch("/api/agent/status");
        const status = await response.json();
        if (!response.ok) throw new Error(status.error || "Статус недоступен");
        if (!status.configured) {
          badge.textContent = "НЕ НАСТРОЕН";
          label.textContent = "Нужно добавить THEEND_AGENT_TOKEN в настройки сервера Render.";
        } else if (status.online && status.agent && status.agent.emulatorConnected) {
          badge.textContent = "ЭМУЛЯТОР ПОДКЛЮЧЁН";
          badge.className = "badge";
          label.textContent = status.agent.deviceName + " · связь активна";
        } else if (status.online) {
          badge.textContent = "АГЕНТ В СЕТИ";
          label.textContent = (status.agent.deviceName || "Android") + " · эмулятор не обнаружен";
        } else {
          badge.textContent = "НЕ В СЕТИ";
          label.textContent = "Запусти TheEnd Agent на компьютере с работающим Android-эмулятором.";
        }
      } catch (error) {
        badge.textContent = "ОШИБКА";
        label.textContent = error.message || "Не удалось проверить агента.";
      }
    }
    updateAgentStatus();
    const agentStatusTimer = setInterval(() => {
      if (currentPage === "automation") updateAgentStatus();
      else clearInterval(agentStatusTimer);
    }, 15000);

    function openModuleDetails(item, enabled, openSettings=false) {
      const [key,title,description]=item;

      shade.className="module-modal-shade";
      shade.innerHTML='<section class="module-modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><header class="module-modal-head"><strong>'+esc(title)+'</strong><span class="module-status '+(enabled?'':'off')+'">'+(enabled?'НА ПАУЗЕ':'ВЫКЛЮЧЕНА')+'</span></header><nav class="module-tabs"><button class="module-tab '+(!openSettings?'active':'')+'" data-tab="now">Сейчас</button><button class="module-tab '+(openSettings?'active':'')+'" data-tab="settings">Настройки</button></nav><div class="module-modal-body" id="moduleModalBody"></div><footer class="module-modal-foot"><button class="module-modal-ok">OK</button></footer></section>';

        else body.innerHTML='<p><b>Режим:</b> '+(enabled?'Включён в профиле автоматизации':'Выключен')+'</p><p><b>Синхронизация:</b> настройки сохраняются на сервере и передаются агенту.</p><p style="color:#aab5b1">Параметры самой игровой активности появятся после реализации и проверки её алгоритма.</p>';

      shade.querySelectorAll(".module-tab").forEach(b=>b.addEventListener("click",()=>draw(b.dataset.tab)));
      shade.querySelector(".module-modal-ok").onclick=()=>shade.remove();

      draw(openSettings?"settings":"now");

    async function loadActivitySettings() {
      const host=document.getElementById("activitySettings");
      const result=document.getElementById("activitySettingsResult");
      if(!host) return;
      try {
        const response=await fetch("/api/automation/settings");
        const data=await response.json();
        if(!response.ok) throw new Error(data.error || "Не удалось загрузить настройки");
        const settings=data.activities || {};
        host.className="module-grid";
        host.innerHTML=activityCatalog.map(([key,title,description]) => {
          const implemented = key === "town_production";
          const enabled = settings[key]===true;
          const state = enabled ? "НА ПАУЗЕ" : "ВЫКЛЮЧЕНА";
          return '<article class="module-tile"><div class="module-top"><strong>'+esc(title)+'</strong><label class="switch module-control" title="Включить или выключить"><input type="checkbox" role="switch" aria-label="'+esc(title)+'" class="activity-toggle module-toggle" data-key="'+key+'" '+(enabled?'checked':'')+'></label></div><span class="module-status '+(enabled?'':'off')+'">'+state+'</span><div class="module-description">'+(enabled?'запустится вместе с ботом':esc(description))+'</div><div class="module-footer"><span class="module-grip">⠿</span><div class="module-actions"><button class="module-action" data-module-open="'+key+'">Подробнее</button><button class="module-action" data-module-settings="'+key+'" aria-label="Настройки">⚙</button></div></div></article>';
        }).join("");
        host.querySelectorAll(".activity-toggle").forEach(input => {
          input.addEventListener("change",()=> {
            const tile=input.closest(".module-tile"), badge=tile.querySelector(".module-status"), desc=tile.querySelector(".module-description");
            badge.textContent=input.checked?"НА ПАУЗЕ":"ВЫКЛЮЧЕНА";
            badge.classList.toggle("off",!input.checked);
            desc.textContent=input.checked?"запустится вместе с ботом":activityCatalog.find(([k])=>k===input.dataset.key)?.[2] || "";
          });
        });
        host.querySelectorAll("[data-module-open],[data-module-settings]").forEach(button => button.addEventListener("click",()=> {
          const key=button.dataset.moduleOpen || button.dataset.moduleSettings;
          const item=activityCatalog.find(([k])=>k===key);
          if(item) openModuleDetails(item,settings[key]===true,button.hasAttribute("data-module-settings"));
        }));
        host.querySelectorAll(".activity-toggle").forEach(input => input.addEventListener("change", async () => {
          input.disabled=true;
          const activities={};
          host.querySelectorAll(".activity-toggle").forEach(control => { activities[control.dataset.key]=control.checked; });
          result.textContent="Сохраняю настройки…";
          try {
            const saved=await fetch("/api/automation/settings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({activities})});
            const payload=await saved.json();
            if(!saved.ok) throw new Error(payload.error || "Ошибка сохранения");
            result.textContent="Настройки сохранены на сервере. Агент получит их при следующей синхронизации.";
            logAction("Обновлены игровые модули",activityCatalog.filter(([key])=>activities[key]).map(([,name])=>name).join(", ") || "Все модули выключены");
          } catch(error) {
            input.checked=!input.checked;
            result.textContent=error.message || "Не удалось сохранить настройки.";
          } finally { input.disabled=false; }
        }));
        result.textContent="Настройки загружены из Neon · "+activityCatalog.filter(([key])=>settings[key]===true).length+" включено.";
      } catch(error) {
        host.innerHTML='<p class="task-meta">'+esc(error.message || "Не удалось загрузить настройки.")+'</p>';
        result.textContent="Сервер настроек недоступен.";
      }
    }
    loadActivitySettings();
    document.getElementById("addTask").onclick = () => openTaskModal();
    document.getElementById("addDailyPack").onclick = async () => {
      const current = readTasks();
      const presets = [["Сбор ресурсов","09:00"],["Проверка энергии","12:00"],["Проверка строительства","15:00"],["Проверка исследований","18:00"],["Проверка альянса","21:00"]];
      const existing = new Set(current.filter(t => t.recurrence === "daily").map(t => t.title));
      const additions = presets.filter(p => !existing.has(p[0])).map(p => {
        const d = new Date(); d.setHours(Number(p[1].slice(0,2)),Number(p[1].slice(3,5)),0,0);
        return {title:p[0],type:"Ежедневное напоминание",accountId:null,scheduledAt:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"T"+p[1],recurrence:"daily",enabled:true};
      });
      if (current.length + additions.length > TASK_LIMIT) { alert("Не хватает места. Удали лишние задачи и повтори."); return; }
      try {
        const results = await Promise.all(additions.map(task => fetch("/api/tasks", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(task)})));
        const failed = results.find(response => !response.ok);
        if (failed) throw new Error("Не удалось сохранить ежедневный набор.");
        await refreshTasks();
        logAction("Добавлен ежедневный набор", additions.length+" напоминаний для Last Asylum");
        renderAutomation();
      } catch (error) { alert(error.message || "Ошибка соединения с сервером."); }
    };
    document.querySelectorAll(".task-edit").forEach(btn => btn.onclick = () => openTaskModal(btn.dataset.id));
    document.querySelectorAll(".task-delete").forEach(btn => btn.onclick = async () => {
      if (readSettings().confirmDelete && !confirm("Удалить эту задачу?")) return;
      const id = btn.dataset.id;
      const item = readTasks().find(t => String(t.id) === String(id));
      try {
        const response = await fetch("/api/tasks/" + id, {method:"DELETE"});
        if (!response.ok) throw new Error("Не удалось удалить задачу.");
        await refreshTasks();
        logAction("Задача удалена", item ? item.title : "");
        renderAutomation();
      } catch (error) { alert(error.message || "Ошибка соединения с сервером."); }
    });
    document.querySelectorAll(".task-toggle").forEach(input => input.onchange = async () => {
      const id = input.dataset.id;
      const item = readTasks().find(t => String(t.id) === String(id));
      if (!item) return;
      try {
        const response = await fetch("/api/tasks/" + id, {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({...item,enabled:input.checked})});
        if (!response.ok) throw new Error("Не удалось изменить задачу.");
        await refreshTasks();
        logAction(input.checked ? "Задача включена" : "Задача отключена", item.title);
        renderAutomation();
      } catch (error) { input.checked = !input.checked; alert(error.message || "Ошибка соединения с сервером."); }
    });
  }

  }

  function setActive(page) {
    nav.forEach(btn => btn.classList.toggle("active", btn.dataset.page === page));
  }

  function topbar(section) {
    return `<div class="topbar">
      <div class="crumb">Панель управления　/　${esc(section)}</div>
      <span class="system-status">● ДЕМО-СИСТЕМА</span>
    </div>`;
  }

  function renderHome() {
    const accounts = readAccounts();
    main.innerHTML = `
      ${topbar("Обзор")}
      <h1>Добро пожаловать в TheEnd</h1>
      <p class="subtitle">Твоя игровая панель — профили и инструменты в одном месте.</p>
      <section class="hero">
        <span class="hero-tag">PREVIEW · DEMO</span>
        <h2>Всё под контролем.</h2>
        <p>Управляй профилями, следи за статусом и изучай возможности панели TheEnd.</p>
        <button class="primary" id="goAccounts">Мои аккаунты　→</button>
      </section>
      <section class="stats">
        <div class="stat"><div class="stat-label">Игровые профили</div><div class="stat-value">${accounts.length} / ${LIMIT}</div><div class="stat-foot">Сохранено в браузере</div></div>
        <div class="stat"><div class="stat-label">Активные задачи</div><div class="stat-value">0</div><div class="stat-foot">Демо-режим</div></div>
        <div class="stat"><div class="stat-label">Выполнено сегодня</div><div class="stat-value">0</div><div class="stat-foot">Демо-счётчик</div></div>
        <div class="stat"><div class="stat-label">Система</div><div class="stat-value">DEMO</div><div class="stat-foot">Игровые действия отключены</div></div>
      </section>
      <section class="grid">
        <div class="card">
          <div class="card-title"><h3>Последняя активность</h3></div>
          <div class="activity"><div class="activity-icon">✧</div><div><strong>TheEnd запущен</strong><small>Панель готова к использованию</small></div><span class="badge">Готово</span></div>
          <div class="activity"><div class="activity-icon">▣</div><div><strong>Управление аккаунтами</strong><small>Можно добавлять игровые профили</small></div><span class="badge demo">Демо</span></div>
        </div>
        <div class="card">
          <div class="card-title"><h3>Игровые пространства</h3></div>
          <div class="server"><div class="server-left"><div class="server-icon">♜</div><div><strong>Last Asylum</strong><small>Игровой профиль</small></div></div><span class="badge demo">Демо</span></div>
          <div class="server"><div class="server-left"><div class="server-icon">＋</div><div><strong>Интеграции</strong><small>Будущие обновления</small></div></div><span class="link">Скоро</span></div>
        </div>
      </section>
      <div class="footer">THEEND DASHBOARD · BUILD 0.2</div>`;
    document.getElementById("goAccounts").onclick = () => showPage("accounts");
  }

  function renderAccounts() {
    const accounts = readAccounts();
    main.innerHTML = `
      ${topbar("Мои аккаунты")}
      <h1>Мои аккаунты</h1>
      <p class="subtitle">Сохраняй игровые профили и управляй их списком.</p>
      <section class="hero">
        <span class="hero-tag">ACCOUNT MANAGER</span>
        <h2>Игровые профили</h2>
        <p>Добавляй ник, UID и сервер. Данные остаются в этом браузере. Пароли и токены здесь не используются.</p>
        <button class="primary" id="addAccount">＋ Добавить аккаунт</button>
      </section>
      <section class="stats">
        <div class="stat"><div class="stat-label">Сохранено профилей</div><div class="stat-value">${accounts.length} / ${LIMIT}</div><div class="stat-foot">Лимит демо-версии</div></div>
        <div class="stat"><div class="stat-label">Режим</div><div class="stat-value">DEMO</div><div class="stat-foot">Без подключения к игре</div></div>
      </section>
      <section class="card">
        <div class="card-title"><h3>Список профилей</h3><span class="link">${accounts.length} / ${LIMIT}</span></div>
        ${accounts.length ? accounts.map((a,i) => `
          <div class="activity account-row">
            <div class="activity-icon">♜</div>
            <div class="account-info">
              <strong>${esc(a.name)}</strong>
              <small>UID: ${esc(a.uid)} · Сервер: ${esc(a.server)}</small>
              <small style="color:${a.status==="Активен"?"var(--green)":a.status==="Неактивен"?"var(--red)":"var(--yellow)"}">● ${esc(a.status)}</small>
            </div>
            <div class="actions">
              <button class="icon-btn edit-btn" data-index="${i}" title="Редактировать">✎</button>
              <button class="icon-btn delete-btn" data-index="${i}" title="Удалить">✕</button>
            </div>
          </div>
        `).join("") : `
          <div class="empty"><div class="empty-icon">♜</div><strong>Аккаунтов пока нет</strong><p>Нажми «Добавить аккаунт» для создания профиля.</p></div>
        `}
      </section>
      <div class="footer">THEEND · ACCOUNT MANAGER · DEMO</div>`;

    document.getElementById("addAccount").onclick = () => openModal(null);

    document.querySelectorAll(".edit-btn").forEach(btn => {
      btn.onclick = () => openModal(Number(btn.dataset.index));
    });

    document.querySelectorAll(".delete-btn").forEach(btn => {
      btn.onclick = async () => {
        const index = Number(btn.dataset.index);
        const account = readAccounts()[index];
        if (!account) return;
        if (readSettings().confirmDelete && !confirm("Удалить этот профиль?")) return;
        try {
          const response = await fetch("/api/accounts/" + account.id, { method:"DELETE" });
          if (!response.ok) throw new Error("Не удалось удалить аккаунт.");
          await refreshAccounts();
          logAction("Профиль удалён", account.name);
          renderAccounts();
        } catch (error) {
          alert(error.message || "Ошибка соединения с сервером.");
        }
      };
    });
  }


  function showPage(page) {
    currentPage = page;
    setActive(page);
    if (page === "home") renderHome();
    else if (page === "accounts") renderAccounts();
    else if (page === "automation") renderAutomation();
    else if (page === "schedule") renderSchedule();
    else if (page === "history") renderHistory();
    else if (page === "settings") renderSettings();
    else renderHome();
  }

  function openModal(index) {
    const data = readAccounts();
    if (index === null && data.length >= LIMIT) {
      alert("Достигнут лимит демо-версии — 5 профилей.");
      return;
    }
    editingIndex = index;
    const a = index === null ? {name:"",uid:"",server:"",status:"Демо"} : data[index];
    document.getElementById("modalTitle").textContent = index === null ? "Добавить аккаунт" : "Редактировать аккаунт";
    document.getElementById("accName").value = a.name || "";
    document.getElementById("accUid").value = a.uid || "";
    document.getElementById("accServer").value = a.server || "";
    document.getElementById("accStatus").value = a.status || "Демо";
    modal.classList.add("open");
    document.getElementById("accName").focus();
  }

  function closeModal() {
    modal.classList.remove("open");
    form.reset();
    editingIndex = null;
  }

  nav.forEach(btn => btn.addEventListener("click", () => showPage(btn.dataset.page)));
  document.getElementById("cancelModal").onclick = closeModal;
  modal.addEventListener("click", e => {
    if (e.target === modal) closeModal();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
  });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = document.getElementById("accName").value.trim();
    const uid = document.getElementById("accUid").value.trim();
    const serverName = document.getElementById("accServer").value.trim();
    const status = document.getElementById("accStatus").value;
    if (!name || !uid || !serverName) return;

    const isNew = editingIndex === null;
    const account = isNew ? null : readAccounts()[editingIndex];
    if (!isNew && !account) {
      alert("Аккаунт не найден. Обнови страницу и попробуй снова.");
      return;
    }
    try {
      const response = await fetch(isNew ? "/api/accounts" : "/api/accounts/" + account.id, {
        method: isNew ? "POST" : "PUT",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({ name, uid, server:serverName, status })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "Не удалось сохранить аккаунт.");
      await refreshAccounts();
      logAction(isNew ? "Профиль добавлен" : "Профиль изменён", name);
      closeModal();
      renderAccounts();
    } catch (error) {
      alert(error.message || "Ошибка соединения с сервером.");
    }
  });


  document.getElementById("cancelTaskModal").onclick = closeTaskModal;
  taskModal.addEventListener("click", e => { if (e.target === taskModal) closeTaskModal(); });
  taskForm.addEventListener("submit", async e => {
    e.preventDefault();
    const title = document.getElementById("taskName").value.trim();
    const type = document.getElementById("taskType").value;
    const accountValue = document.getElementById("taskAccount").value;
    const accountId = accountValue ? Number(accountValue) : null;
    const scheduledAt = document.getElementById("taskDate").value;
    const recurrence = document.getElementById("taskRecurrence").value;
    const enabled = document.getElementById("taskEnabled").checked;
    if (!title || !scheduledAt || Number.isNaN(new Date(scheduledAt).getTime())) return;
    const isNew = editingTaskId === null;
    const existing = isNew ? null : readTasks().find(t => String(t.id) === String(editingTaskId));
    if (!isNew && !existing) { alert("Задача не найдена. Обнови страницу."); return; }
    const payload = {title,type,accountId,scheduledAt,recurrence,enabled};
    try {
      const response = await fetch(isNew ? "/api/tasks" : "/api/tasks/" + editingTaskId, {
        method:isNew ? "POST" : "PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "Не удалось сохранить задачу.");
      await refreshTasks();
      logAction(isNew ? "Задача создана" : "Задача изменена", title);
      closeTaskModal();
      renderAutomation();
    } catch (error) { alert(error.message || "Ошибка соединения с сервером."); }
  });

  function checkTaskReminders() {
    const now = new Date();
    const today = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
    const tasks = readTasks(); let changed = false;
    tasks.forEach(task => {
      if (!task.enabled) return;
      let due = false;
      if (task.recurrence === "daily") {
        const time = (task.scheduledAt || "").slice(11,16);
        const nowTime = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
        due = !!time && nowTime >= time && task.lastNotifiedDate !== today;
      } else due = !!task.scheduledAt && new Date(task.scheduledAt).getTime() <= now.getTime() && !task.notifiedAt;
      if (!due) return;
      if ("Notification" in window && Notification.permission === "granted") {
        try { new Notification("TheEnd — напоминание", {body:task.title+" · Last Asylum",tag:"theend-task-"+task.id}); } catch {}
      }
      logAction("Напоминание отправлено", task.title);
      const reminderState = task.recurrence === "daily"
        ? { lastNotifiedDate:today }
        : { notifiedAt:now.toISOString() };
      Object.assign(task, reminderState);
      fetch("/api/tasks/" + task.id + "/reminder", {
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(reminderState)
      }).catch(error => console.error("Could not save reminder state:", error));
      changed = true;
    });
  }
  checkTaskReminders();
  setInterval(checkTaskReminders,30000);
  try {
    await refreshAccounts();
    await refreshTasks();
    await refreshHistory();
    showPage("home");
  } catch (error) {
    main.innerHTML = `<section class="card"><h2>Нет связи с TheEnd API</h2><p class="subtitle">${esc(error.message)}</p><button class="primary" id="retryApi">Повторить подключение</button></section>`;
    document.getElementById("retryApi").onclick = async () => {
      try { await refreshAccounts(); await refreshTasks(); await refreshHistory(); showPage(currentPage); }
      catch (retryError) { alert(retryError.message || "Сервер пока недоступен."); }
    };
  }
})();
</script>
</body>
</html>
