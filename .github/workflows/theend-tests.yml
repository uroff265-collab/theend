name: TheEnd cloud tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-agent:
    name: Python agent checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image recognition dependencies
        run: python -m pip install --upgrade pip numpy opencv-python-headless pillow pytesseract
      - name: Compile agent modules
        run: python -m py_compile theend_agent.py theend_vision.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  node-api:
    name: API syntax and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install API dependencies
        run: npm install
      - name: Check API syntax
        run: node --check server.js

  android-cloud:
    name: Free cloud Android emulator
    # Pin to 24.04: ubuntu-latest moved to 26.04, which the emulator action
    # did not boot successfully on in the previous run.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent dependencies and OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus
          python -m pip install --upgrade pip numpy opencv-python-headless pillow pytesseract
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable Android KVM or prepare software fallback
        run: |
          echo "Runner: $(uname -a)"
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "ANDROID_KVM=available" >> "$GITHUB_ENV"
            echo "KVM is readable and writable; hardware acceleration can be used."
          else
            echo "ANDROID_KVM=unavailable" >> "$GITHUB_ENV"
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
            echo "::warning::KVM unavailable. Allowing Android Emulator software CPU emulation (TCG)."
          fi
      - name: Boot Android emulator and test ADB capture
        run: bash tools/boot_cloud_android.sh --smoke
      - name: Upload cloud emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theend-android-cloud-screen
          path: /tmp/theend-cloud-screen.png
          if-no-files-found: ignore
          retention-days: 1
