name: TheEnd cloud tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-agent:
    name: Python agent checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image recognition dependencies
        run: python -m pip install --upgrade pip numpy opencv-python-headless pillow pytesseract
      - name: Compile agent modules
        run: python -m py_compile theend_agent.py theend_vision.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  node-api:
    name: API syntax and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install API dependencies
        run: npm install
      - name: Check API syntax
        run: node --check server.js

  android-cloud:
    name: Free cloud Android emulator
    # Pin to 24.04: ubuntu-latest moved to 26.04, which the emulator action
    # did not boot successfully on in the previous run.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent dependencies and OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus
          python -m pip install --upgrade pip numpy opencv-python-headless pillow pytesseract
      - name: Boot Android emulator and test ADB capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb devices
            adb shell getprop ro.build.version.release
            adb shell wm size 1080x1920
            adb exec-out screencap -p > /tmp/theend-cloud-screen.png
            python - <<'PY'
            from PIL import Image
            import cv2, numpy as np
            p='/tmp/theend-cloud-screen.png'
            im=Image.open(p)
            im.verify()
            frame=cv2.imdecode(np.fromfile(p,dtype=np.uint8),cv2.IMREAD_COLOR)
            assert frame is not None and frame.size > 0, 'OpenCV could not read emulator screenshot'
            print('ANDROID_EMULATOR_OK', frame.shape, 'screenshot_bytes=', __import__('os').path.getsize(p))
            PY
      - name: Upload cloud emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theend-android-cloud-screen
          path: /tmp/theend-cloud-screen.png
          if-no-files-found: ignore
          retention-days: 1
