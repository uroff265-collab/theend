name: TheEnd cloud game session

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theend-cloud-android-session
  cancel-in-progress: true

jobs:
  android-session:
    name: Protected cloud Android session
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install cloud emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 openssh-client
      - name: Enable Android KVM or configure safe software fallback
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM acceleration is available."
          else
            echo "KVM is unavailable; enabling Android Emulator TCG fallback."
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi
      - name: Boot Android and publish protected browser session
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          # Match the google_apis image that passed the cloud ADB/screenshot job.
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics
          emulator-boot-timeout: 1200
          script: bash tools/start_cloud_session.sh
