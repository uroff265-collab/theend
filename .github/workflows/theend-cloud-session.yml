name: TheEnd cloud game session

on:
  push:
    branches: [main, feature/theend-supervisor-mvp]
    paths:
      - '.github/workflows/theend-cloud-session.yml'
      - 'tools/cloud_android_remote.py'
      - 'tools/start_cloud_session.sh'
      - 'tools/boot_cloud_android.sh'
      - 'server.js'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: theend-cloud-android-session
  cancel-in-progress: true

jobs:
  android-session:
    name: Protected cloud Android session
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install cloud emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3 openssh-client sshpass
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable Android KVM or configure safe software fallback
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=/dev/kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM acceleration is available."
          else
            echo "KVM is unavailable; enabling Android Emulator TCG fallback."
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi
      - name: Boot Android emulator without the flaky action ADB handoff
        run: bash tools/boot_cloud_android.sh --start-only
      - name: Publish protected browser session
        run: bash tools/start_cloud_session.sh
      - name: Upload cloud Android startup screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theend-cloud-session-screen
          path: |
            /tmp/theend-cloud-screen.png
            /tmp/theend-cloud-session-link.txt
          if-no-files-found: ignore
          retention-days: 1
