name: TheEnd Supervisor audit

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: theend-supervisor-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Independent AI security and reliability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Supervisor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THEEND_SUPERVISOR_MODEL: gpt-6.2-sol
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python supervisor/audit.py
