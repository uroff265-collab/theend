name: TheEnd Supervisor audit

on:
  workflow_dispatch:
    inputs:
      run_ai:
        description: "Run the optional paid AI review (requires API credits)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main, feature/theend-supervisor-mvp]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: theend-supervisor-audit
  cancel-in-progress: false

jobs:
  static:
    name: Free offline security checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run free static audit
        run: python supervisor/static_audit.py

  ai:
    name: Optional paid AI review
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ai == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run AI Supervisor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THEEND_SUPERVISOR_MODEL: gpt-6.2-sol
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python supervisor/audit.py
