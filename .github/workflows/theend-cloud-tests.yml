name: TheEnd cloud tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-agent:
    name: Python agent checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install vision dependencies
        run: python -m pip install --upgrade pip numpy opencv-python-headless pillow pytesseract
      - name: Compile agent modules
        run: python -m py_compile theend_agent.py theend_vision.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  node-api:
    name: API syntax and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install API dependencies
        run: npm install
      - name: Check API syntax
        run: node --check server.js
